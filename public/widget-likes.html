<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voztok - Top Likes Widget</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: transparent !important;
            margin: 0;
            padding: 12px;
            display: inline-block;
            overflow: visible;
        }
        .widget-container {
            background: rgba(15, 23, 42, 0.65); /* Transparente pero con buen contraste */
            backdrop-filter: blur(8px); /* Difumina ligeramente el fondo de la cámara */
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 14px;
            padding: 16px 14px 14px 14px;
            width: 320px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
            overflow: visible;
        }
        h3 {
            margin: 0 0 12px 0;
            font-size: 15px;
            font-weight: 800;
            color: #38bdf8;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.5px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            padding-bottom: 8px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9);
        }
        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 6px;
            font-size: 14px;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.1);
            position: relative;
        }
        li:last-child {
            border-bottom: none;
        }
        
        .rank-info {
            display: flex;
            align-items: center;
            gap: 10px;
            overflow: hidden;
            flex-grow: 1;
        }
        .rank-number {
            font-weight: 800;
            font-size: 15px;
            color: #cbd5e1;
            width: 24px;
            text-align: center;
            flex-shrink: 0;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9);
        }
        
        .crown-container {
            position: relative;
            flex-shrink: 0;
            margin-top: 6px;
        }
        .crown {
            position: absolute;
            top: -18px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 16px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));
        }

        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #38bdf8;
            flex-shrink: 0;
            box-shadow: 0 2px 6px rgba(0,0,0,0.5);
        }
        .top-1 .user-avatar { border-color: #fbbf24; }
        .top-2 .user-avatar { border-color: #e2e8f0; }
        .top-3 .user-avatar { border-color: #f97316; }

        /* Nombres con texto en negrita y sombra negra contra fondos claros */
        .user-name {
            font-weight: 700;
            color: #ffffff;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 150px;
            font-size: 14px;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.95), 0 0 2px rgba(0, 0, 0, 0.8);
        }
        
        /* Colores destacados pero legibles para el Podio */
        .top-1 .user-name { color: #ffe066; }
        .top-2 .user-name { color: #f1f5f9; }
        .top-3 .user-name { color: #ffb703; }

        .score-container {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 800;
            color: #ff4d6d;
            flex-shrink: 0;
            font-size: 15px;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.95);
        }
        
        @keyframes heartbeat {
            0% { transform: scale(1); }
            15% { transform: scale(1.25); }
            30% { transform: scale(1); }
            45% { transform: scale(1.15); }
            60% { transform: scale(1); }
        }
        .heart-icon {
            display: inline-block;
            animation: heartbeat 1.5s infinite;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));
        }

        .vacio {
            font-size: 13px;
            color: #94a3b8;
            text-align: center;
            margin: 10px 0;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
        }
    </style>
</head>
<body>
    <div class="widget-container">
        <h3>🏆 Ranking de Actividad</h3>
        <ul id="listaLikes">
            <li class="vacio">Esperando actividad...</li>
        </ul>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const listaLikes = document.getElementById('listaLikes');

        socket.on('actualizar-ranking-likes', (topLikes) => {
            if (!topLikes || topLikes.length === 0) {
                listaLikes.innerHTML = '<li class="vacio">Esperando actividad...</li>';
                return;
            }

            listaLikes.innerHTML = '';
            topLikes.forEach((item, index) => {
                const rank = index + 1;
                const avatarSrc = item.avatar ? item.avatar : 'https://p16-sign-va.tiktokcdn.com/tos-maliva-avt-0068/7315582298634567686~tplv-tiktokx-cropcenter:100:100.jpeg';
                
                let topClass = '';
                let rankDisplay = `${rank}.`;
                let crownHtml = '';

                if (rank === 1) {
                    topClass = 'top-1';
                    crownHtml = '<div class="crown">👑</div>';
                    rankDisplay = '🥇';
                } else if (rank === 2) {
                    topClass = 'top-2';
                    rankDisplay = '🥈';
                } else if (rank === 3) {
                    topClass = 'top-3';
                    rankDisplay = '🥉';
                }

                const li = document.createElement('li');
                li.className = topClass;
                li.innerHTML = `
                    <div class="rank-info">
                        <span class="rank-number">${rankDisplay}</span>
                        <div class="crown-container">
                            ${crownHtml}
                            <img src="${avatarSrc}" class="user-avatar" onerror="this.src='https://via.placeholder.com/36'">
                        </div>
                        <span class="user-name" title="${item.user}">${item.user}</span>
                    </div>
                    <div class="score-container">
                        <span class="heart-icon">❤️‍🔥</span>
                        <span>${item.likes.toLocaleString()}</span>
                    </div>
                `;
                listaLikes.appendChild(li);
            });
        });
    </script>
</body>
</html>
